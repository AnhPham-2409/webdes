<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Items CRUD</title>
</head>
<body>

  <h2>Create Item</h2>
  <input id="create-name" placeholder="name">
  <input id="create-price" placeholder="price" type="number">
  <button onclick="createItem()">Create</button>

  <h2>Update Item</h2>
  <input id="update-id" placeholder="id">
  <input id="update-name" placeholder="name">
  <input id="update-price" placeholder="price" type="number">
  <button onclick="updateItem()">Update</button>

  <h2>Delete Item</h2>
  <input id="delete-id" placeholder="id">
  <button onclick="deleteItem()">Delete</button>

  <h2>Get One Item</h2>
  <input id="get-id" placeholder="id">
  <button onclick="getItem()">Get</button>
  <pre id="get-result"></pre>

  <h2>All Items</h2>
  <button onclick="listItems()">Refresh List</button>
  <pre id="list-result"></pre>

  <script>
    const BASE_URL = "";

    async function listItems() {
      const res = await fetch(`${BASE_URL}/items`);
      const data = await res.json();
      document.getElementById("list-result").textContent = JSON.stringify(data, null, 2);
    }

    async function getItem() {
      const id = document.getElementById("get-id").value;
      const res = await fetch(`${BASE_URL}/items/${id}`);
      const data = await res.json();
      document.getElementById("get-result").textContent = JSON.stringify(data, null, 2);
    }

    async function createItem() {
      const name = document.getElementById("create-name").value;
      const price = parseFloat(document.getElementById("create-price").value);

      await fetch(`${BASE_URL}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, price })
      });

      listItems();
    }

    async function updateItem() {
      const id = document.getElementById("update-id").value;
      const name = document.getElementById("update-name").value;
      const price = parseFloat(document.getElementById("update-price").value);

      await fetch(`${BASE_URL}/items/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, price })
      });

      listItems();
    }

    async function deleteItem() {
      const id = document.getElementById("delete-id").value;

      await fetch(`${BASE_URL}/items/${id}`, {
        method: "DELETE"
      });

      listItems();
    }

    // load list when page opens
    listItems();
  </script>

</body>
</html>
