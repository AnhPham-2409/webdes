<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Form</title>
</head>

<body>

    <h1>House Form</h1>

    <form id="houseForm">

        <label for="area">Area (sqm):</label>
        <input id="area" type="number" step="any" required>

        <br><br>

        <label for="bedrooms">Number of bedrooms:</label>
        <input id="bedrooms" type="number" step="1" min="0" required>

        <br><br>

        <label for="distance">Distance to center (km):</label>
        <input id="distance" type="number" step="any" min="0" required>

        <br><br>

        <button type="submit">Submit</button>

    </form>

    <p id="result"></p>

    <script>
        const form = document.getElementById("houseForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            // the API expects JSON numbers, not strings
            const payload = {
                area_sqm: Number(document.getElementById("area").value),
                bedrooms: Number(document.getElementById("bedrooms").value),
                distance_to_center_km: Number(document.getElementById("distance").value)
            };

            try {
                const response = await fetch("/predict/house-price", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    // 422: FastAPI returns a list of {loc, msg} validation errors
                    if (Array.isArray(data.detail)) {
                        const msg = data.detail
                            .map(e => `${e.loc[e.loc.length - 1]}: ${e.msg}`)
                            .join("; ");
                        result.textContent = `Error: ${msg}`;
                    } else {
                        result.textContent = `Error: ${data.detail || "Request failed"}`;
                    }
                    return;
                }

                const formattedPrice = data.predicted_price.toLocaleString("vi-VN");

                result.textContent = `Predicted price: ${formattedPrice} ${data.currency}`;

            } catch (error) {

                result.textContent = "Error: Could not get prediction.";

                console.error(error);
            }
        });
    </script>

</body>
</html>
